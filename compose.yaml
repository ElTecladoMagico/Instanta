# Despliegue en la VPS y Postgres para desarrollo local (ADR-003).
#   Local:  docker compose up -d postgres
#   VPS:    infra/deploy.sh
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: instanta
      POSTGRES_DB: instanta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    volumes:
      - pgdata:/var/lib/postgresql
    # Solo en localhost: accesible para desarrollo, nunca desde internet
    # (Docker se salta ufw con los puertos que publica).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "instanta"]
      interval: 5s
      retries: 10

  migrate:
    # Alembic en su propia imagen de Python (ADR-014); aplica las migraciones y termina.
    image: instanta-migrate
    build: ./db
    environment:
      DATABASE_URL: postgres://instanta:${POSTGRES_PASSWORD:-dev}@postgres:5432/instanta
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [deploy]

  app:
    image: instanta-app
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_ALCHEMY_RPC_URL: ${NEXT_PUBLIC_ALCHEMY_RPC_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://instanta:${POSTGRES_PASSWORD:-dev}@postgres:5432/instanta
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: [deploy]

  worker:
    # Comprueba pagos, caduca los vencidos y envía los webhooks cada 5 s (ADR-003, ADR-009).
    image: instanta-worker
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://instanta:${POSTGRES_PASSWORD:-dev}@postgres:5432/instanta
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: [deploy]

  demo-store:
    # Tienda de ejemplo (ADR-012): un "comercio" que se integra con Instanta como lo haría uno real.
    # Su API key y su secreto de webhooks están en .env.demo, en la VPS (no en el repositorio).
    image: node:24-alpine
    working_dir: /app
    command: ["node", "server.ts"]
    volumes:
      - ./examples/demo-store:/app:ro
    env_file: .env.demo
    environment:
      PUBLIC_URL: https://${DOMAIN:-localhost}/demo
      INSTANTA_API_URL: https://${DOMAIN:-localhost}
    restart: unless-stopped
    profiles: [deploy]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    profiles: [deploy]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
